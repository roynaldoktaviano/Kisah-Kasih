<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f6b58">
<title>Taman Kecil Kami · Undangan Pernikahan</title>
<meta name="description" content="Masuk ke taman kecil kami dan ketuk benda yang berkilau untuk membuka undangannya.">
<meta property="og:title" content="Kamu diundang ke taman kecil kami 🌿">
<meta property="og:description" content="Ketuk benda yang berkilau untuk membuka undangan pernikahan kami.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Kalam:wght@400;700&family=Nunito+Sans:wght@400;600;700&family=Parisienne&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ink:#2f3b2c; --ink-2:#56644f; --ink-3:#8e9a86;
  --sage:#9dbb95; --sage-2:#e3eddc; --sage-3:#f3f7ef; --sage-d:#4f6b58;
  --terra:#c96d47; --terra-2:#f6dccd; --gold:#d9b25f;
  --cream:#fbf7ee; --paper:#fffdf7;
  --serif:"Fraunces", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Kalam", "Comic Sans MS", cursive;
  --script:"Parisienne", "Brush Script MT", cursive;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:linear-gradient(180deg, #e8f0e2, #c9dcc0); color:var(--ink); font-family:var(--body); overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button, input, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; padding:0; touch-action:manipulation; }
a{ color:inherit; }
[hidden]{ display:none !important; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2.5px solid var(--terra); outline-offset:3px; }
.i{ width:18px; height:18px; flex:none; }

/* ============ tata letak: mobile penuh; desktop = taman kiri + banner kanan ============ */
.app{ position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; margin:0 auto; overflow:hidden; background:#a9c99a; isolation:isolate; }
.banner{ display:none; }
@media (min-width:900px){
  body{ display:flex; background:#3d5445; }
  .app{ flex:none; width:430px; margin:0; box-shadow:1px 0 0 rgba(255,255,255,.25), 24px 0 60px rgba(30,45,30,.35); z-index:2; }
  .banner{ display:block; }
}

/* ============ banner kanan (desktop) ============ */
.banner{ position:relative; flex:1; height:100vh; height:100dvh; overflow:hidden; color:var(--ink); }
.bn-land{ position:absolute; inset:0; width:100%; height:100%; }
.bn-bg{ position:absolute; inset:0; }
.bn-bg.photo{ inset:-4%; background-size:cover; background-position:center; animation:kenburns 26s ease-in-out infinite alternate; }
@keyframes kenburns{ from{ transform:scale(1.08) translate(1%, -1%); } to{ transform:scale(1) translate(-1%, 1%); } }
.bn-shade{ position:absolute; inset:0; background:radial-gradient(ellipse 46% 40% at 50% 46%, rgba(255,253,247,.72), rgba(255,253,247,0) 75%); }
.bn-bg.photo ~ .bn-shade{ background:linear-gradient(90deg, rgba(47,59,44,.78), rgba(47,59,44,.42) 55%, rgba(47,59,44,.7)), linear-gradient(0deg, rgba(47,59,44,.9), transparent 55%); }
.bn-bg.photo ~ .bn-inner{ color:#fff; }
.bn-bg.photo ~ .bn-inner .bn-names, .bn-bg.photo ~ .bn-inner .bn-eyebrow, .bn-bg.photo ~ .bn-inner .bn-date, .bn-bg.photo ~ .bn-inner .bn-guest{ color:#fff; }
.bn-inner{ position:absolute; inset:40px 0 70px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 48px; }
.bn-art{ width:min(210px, 21vh); height:auto; margin-bottom:10px; animation:bnUp 1.2s var(--ease) .2s both; }
.bn-eyebrow{ margin:0 0 4px; font:italic 500 clamp(18px, 1.6vw, 24px) var(--serif); color:var(--ink-2); animation:bnUp 1.1s var(--ease) .4s both; }
.bn-names{ margin:0; font:400 clamp(76px, 8.2vw, 148px)/1.05 var(--script); color:var(--sage-d); display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:0 .22em; }
.bn-names span{ animation:bnUp 1.3s var(--ease) both; }
.bn-names span:first-child{ animation-delay:.55s; } .bn-names span:last-child{ animation-delay:1.05s; }
.bn-names em{ font-style:normal; font-size:.55em; color:var(--terra); animation:bnPop 1s cubic-bezier(.3,1.6,.5,1) .85s both; }
@keyframes bnUp{ from{ opacity:0; transform:translateY(36px); filter:blur(8px); } }
@keyframes bnPop{ from{ opacity:0; transform:scale(.3) rotate(-20deg); } }
.bn-date{ margin:18px 0 0; font:700 14px var(--body); letter-spacing:.3em; text-transform:uppercase; color:var(--ink); animation:bnUp 1.1s var(--ease) 1.4s both; }
.bn-guest{ margin:14px 0 0; font-size:16px; color:var(--ink-2); animation:bnUp 1.1s var(--ease) 1.6s both; }
.bn-guest b{ color:var(--ink); }
.bn-hint{ margin:24px 0 0; display:inline-flex; align-items:center; gap:8px; padding:8px 18px; border-radius:999px; border:1.8px solid var(--ink); background:var(--paper); font:17px var(--hand); color:var(--ink); box-shadow:0 3px 0 var(--ink); animation:bnUp 1.1s var(--ease) 1.8s both; }
.bn-ticker{ position:absolute; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; overflow:hidden; background:var(--sage-d); }
.bn-ticker-run{ display:flex; white-space:nowrap; font:700 12px var(--body); letter-spacing:.3em; text-transform:uppercase; color:#f3f7ef; animation:marq 40s linear infinite; }
.bn-ticker-run span{ padding-right:48px; }
@keyframes marq{ to{ transform:translateX(-50%); } }

/* ============ taman ============ */
.scene{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:filter 1.1s ease, transform 1.6s var(--ease); }
.app.closed .scene{ filter:blur(5px) saturate(.8) brightness(.92); transform:scale(1.1); }
.hs, .egg{ cursor:pointer; outline:none; }
.hs .art{ transform-box:fill-box; transform-origin:50% 60%; transition:transform .35s var(--ease);
  filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 6px rgba(255,251,225,.95));
  animation:glow 2.4s ease-in-out infinite; }
.hs:nth-of-type(2n) .art{ animation-delay:-1.2s; }
@keyframes glow{ 50%{ filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 0 2px rgba(255,251,225,.3)); } }
.app.closed .hs .art{ animation:none; filter:none; }
.hs:hover .art, .hs:focus-visible .art{ transform:scale(1.05); }
.hs.tap .art{ animation:tap .45s var(--ease); }
@keyframes tap{ 40%{ transform:scale(.92); } 75%{ transform:scale(1.06); } }
.lbl{ animation:sway 3.6s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 50%; }
.hs:nth-of-type(3n) .lbl{ animation-delay:-1.2s; } .hs:nth-of-type(3n+1) .lbl{ animation-delay:-2.4s; }
@keyframes sway{ 50%{ transform:rotate(-2.5deg); } }
.lbl path{ fill:#fffaf0; stroke:#2f3b2c; stroke-width:1.5; stroke-linejoin:round; }
.lbl text{ font-family:var(--hand); font-weight:700; font-size:14px; fill:#2f3b2c; text-anchor:middle; dominant-baseline:central; }
.hs:focus-visible .lbl path{ stroke:var(--terra); stroke-width:2.6; }
.spark{ animation:spark 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes spark{ 0%,100%{ opacity:0; transform:scale(.3) rotate(0); } 50%{ opacity:1; transform:scale(1) rotate(45deg); } }
.app.closed .spark{ display:none; }
.hit{ fill:transparent; }
.float{ animation:float 5s ease-in-out infinite; }
@keyframes float{ 50%{ transform:translateY(-7px); } }
.float2{ animation:float 7s ease-in-out infinite -2s; }
.cloud{ animation:drift 60s linear infinite; }
.cloud.c2{ animation-duration:85s; animation-delay:-40s; }
@keyframes drift{ from{ transform:translateX(-160px); } to{ transform:translateX(320px); } }
.floaty{ transform-box:fill-box; transform-origin:center; animation:floaty 3s ease-in-out infinite; }
@keyframes floaty{ 50%{ transform:translateY(-5px) scale(1.08); } }
.wag{ transform-box:fill-box; transform-origin:0% 50%; animation:wag .5s ease-in-out infinite alternate; }
@keyframes wag{ to{ transform:rotate(18deg); } }
.breath{ transform-box:fill-box; transform-origin:50% 100%; animation:breath 3s ease-in-out infinite; }
@keyframes breath{ 50%{ transform:scaleY(1.05); } }
.zzz{ animation:zzz 3s ease-in-out infinite; }
@keyframes zzz{ 0%{ opacity:0; transform:translate(0,0); } 30%{ opacity:1; } 100%{ opacity:0; transform:translate(-6px,-14px); } }
.flap{ transform-box:fill-box; transform-origin:50% 50%; animation:flap .22s ease-in-out infinite alternate; }
@keyframes flap{ to{ transform:scaleX(.25); } }
.bfly{ animation:bfly 14s ease-in-out infinite; }
.bfly.b2{ animation-duration:17s; animation-delay:-6s; }
@keyframes bfly{ 0%,100%{ transform:translate(0,0); } 25%{ transform:translate(40px,-30px); } 50%{ transform:translate(90px,10px); } 75%{ transform:translate(30px,35px); } }
.petal{ animation:petal linear infinite; transform-box:fill-box; transform-origin:center; }
@keyframes petal{ from{ transform:translate(0,-80px) rotate(0); opacity:0; } 8%{ opacity:.9; } 90%{ opacity:.8; } to{ transform:translate(var(--dx),960px) rotate(600deg); opacity:0; } }
.egg:focus-visible > *{ filter:drop-shadow(0 0 3px #fff); }
/* mode gambar ilustrasi */
.app.img-mode{ background:#2f3b2c; }
.app.img-mode::before{ content:""; position:absolute; inset:-40px; z-index:-1; background:var(--latar) center / cover no-repeat; filter:blur(26px) brightness(.85); }
.ring{ fill:rgba(255,251,225,.1); stroke:#fffbe6; animation:ringp 2.4s ease-in-out infinite; }
@keyframes ringp{ 50%{ stroke-opacity:.3; fill-opacity:.02; } }
.atur .ring{ stroke:#ff5a36; stroke-dasharray:12 8; animation:none; }

/* ============ tombol atas ============ */
.tb{ position:absolute; z-index:5; width:44px; height:44px; border-radius:14px; background:var(--paper); color:var(--ink); display:grid; place-items:center; border:1.8px solid var(--ink); box-shadow:0 3px 0 var(--ink), 0 8px 18px rgba(30,45,30,.22); transition:opacity .5s, transform .15s, box-shadow .15s; }
.tb:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
.tb .i{ width:21px; height:21px; }
#b-info{ top:calc(14px + env(safe-area-inset-top)); left:14px; }
.tb-r{ position:absolute; z-index:5; right:14px; top:calc(14px + env(safe-area-inset-top)); display:flex; flex-direction:column; gap:12px; transition:opacity .5s; }
.tb-r .tb{ position:relative; }
#b-music.on{ background:var(--sage-2); }
#b-music.on::after{ content:""; position:absolute; top:-4px; right:-4px; width:10px; height:10px; border-radius:50%; background:var(--terra); border:1.5px solid var(--ink); animation:beat 1s ease-in-out infinite; }
@keyframes beat{ 50%{ transform:scale(1.35); } }
#b-music:not(.on) .i{ opacity:.45; }
.app.closed .tb, .app.closed .wish, .app.closed .tb-r{ opacity:0; pointer-events:none; }

/* ============ ucapan ============ */
.wish{ position:absolute; z-index:5; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); width:min(268px, calc(100% - 118px)); transition:opacity .5s; }
.wcard{ position:relative; display:block; width:100%; text-align:left; background:var(--paper); border:1.8px solid var(--ink); border-radius:6px 16px 16px 16px; padding:10px 12px 9px; margin-bottom:8px; box-shadow:0 3px 0 var(--ink), 0 10px 18px rgba(30,45,30,.25); transition:opacity .35s, transform .35s; }
.wcard::before{ content:""; position:absolute; top:-8px; left:22px; width:50px; height:14px; rotate:-4deg; background:rgba(217,178,95,.78); }
.wcard.swap{ opacity:0; transform:translateY(8px); }
.wn{ display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:700 12px var(--body); color:var(--sage-d); margin-bottom:2px; }
.wn::before{ content:"🌿 "; }
.wm{ margin:0; font-size:12.5px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.wbtns{ display:flex; gap:6px; }
.wbtns button{ height:32px; min-width:32px; border-radius:10px; background:var(--sage-d); color:#f3f7ef; border:1.8px solid var(--ink); display:grid; place-items:center; font:600 12.5px var(--body); padding:0 10px; box-shadow:0 2px 0 var(--ink); white-space:nowrap; }
.wbtns button .i{ width:17px; height:17px; }
.wish.min .wcard{ display:none; }

/* ============ sampul ============ */
.cover{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:24px; transition:opacity .7s, visibility .7s; }
.cover.gone{ opacity:0; visibility:hidden; }
.cv{ position:relative; width:100%; max-width:320px; background:var(--paper); border:2px solid var(--ink); border-radius:170px 170px 22px 22px; text-align:center; padding:34px 22px 24px; box-shadow:0 5px 0 var(--ink), 0 26px 60px rgba(30,45,30,.4); animation:cvin .9s var(--ease) both .25s; }
.cv::before{ content:""; position:absolute; inset:8px; border:1.4px dashed var(--sage); border-radius:162px 162px 16px 16px; pointer-events:none; }
@keyframes cvin{ from{ opacity:0; transform:translateY(24px) scale(.94); } }
.cv-art{ width:150px; height:auto; display:block; margin:0 auto 4px; }
.cv-k{ font:italic 500 15px var(--serif); color:var(--ink-2); margin:0; }
.cv-n{ font:400 42px/1.15 var(--script); margin:4px 0 4px; color:var(--sage-d); white-space:nowrap; }
.cv-n span{ font-size:.62em; color:var(--terra); }
.cv-d{ font:700 11px var(--body); letter-spacing:.22em; text-transform:uppercase; color:var(--ink-2); margin:0; }
.cv-to{ margin:16px 0 18px; padding:10px 12px; background:var(--sage-3); border-radius:14px; }
.cv-to span{ font-size:12px; color:var(--ink-2); }
.cv-to b{ display:block; font:700 19px/1.3 var(--serif); margin-top:2px; word-break:break-word; }

/* ============ tombol umum ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 20px; border-radius:14px; border:1.8px solid var(--ink); background:var(--sage-2); font:700 14.5px var(--body); text-decoration:none; color:var(--ink); box-shadow:0 3px 0 var(--ink); transition:transform .15s, box-shadow .15s, background .2s; }
.btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
.btn.solid{ background:var(--sage-d); color:#f3f7ef; }
.btn.block{ display:flex; width:100%; }
.btn.sm{ min-height:36px; padding:0 14px; font-size:13px; flex:none; }
.btn.ok{ background:var(--terra-2); color:var(--ink); }

/* ============ toast & efek ============ */
.toast{ position:absolute; z-index:30; left:50%; top:calc(72px + env(safe-area-inset-top)); width:max-content; max-width:calc(100% - 130px); background:var(--paper); border:1.8px solid var(--ink); border-radius:14px; padding:6px 14px; font:16px/1.3 var(--hand); text-align:center; box-shadow:0 3px 0 var(--ink); opacity:0; transform:translate(-50%,-8px); transition:opacity .35s, transform .35s; pointer-events:none; }
.toast.on{ opacity:1; transform:translate(-50%,0); }
.fx{ position:absolute; z-index:8; pointer-events:none; font-size:20px; animation:fx 1.2s ease-out forwards; }
@keyframes fx{ to{ opacity:0; transform:translate(var(--x), var(--y)) scale(1.3) rotate(var(--r)); } }

/* ============ kartu pop-up ============ */
.ov{ position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }
.ov-bg{ position:absolute; inset:0; background:rgba(35,48,35,.45); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); opacity:0; transition:opacity .3s; }
.ov.open .ov-bg{ opacity:1; }
.win{ position:relative; width:100%; max-width:384px; max-height:min(86dvh, 780px); display:flex; flex-direction:column; background:var(--paper); border:2px solid var(--ink); border-radius:22px; overflow:hidden; box-shadow:0 5px 0 var(--ink), 0 24px 60px rgba(20,30,20,.4); transform:scale(.12) rotate(-6deg); opacity:0; transition:transform .5s var(--ease), opacity .25s; }
.ov.open .win{ transform:none; opacity:1; }
.win-h{ position:relative; display:flex; align-items:center; justify-content:center; gap:8px; padding:16px 52px 16px; background:var(--sage-d); color:#f3f7ef; border-bottom:2px solid var(--ink); }
.win-h::after{ content:""; position:absolute; left:0; right:0; bottom:-10px; height:8px; background:radial-gradient(circle at 8px 0, var(--sage-d) 6.5px, transparent 7px) 0 0 / 16px 8px repeat-x; pointer-events:none; z-index:1; }
.win-h .leaf{ width:20px; height:20px; color:#cfe0c6; }
.win-h h2{ margin:0; font:600 21px/1.2 var(--serif); text-align:center; }
.x{ position:absolute; right:10px; top:50%; translate:0 -50%; width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:#f3f7ef; }
.x .i{ width:22px; height:22px; }
.win-b{ overflow-y:auto; overscroll-behavior:contain; padding:24px 16px 24px; -webkit-overflow-scrolling:touch; }

/* ============ isi ============ */
.lead{ margin:0 0 18px; font-size:14.5px; line-height:1.65; color:var(--ink-2); text-align:center; }
.kick{ margin:0 0 4px; font:italic 500 16px var(--serif); color:var(--terra); }
.pcard{ border:1.8px solid var(--ink); border-radius:18px; overflow:hidden; background:var(--sage-3); box-shadow:0 3px 0 var(--ink); }
.pcard .ph{ aspect-ratio:1/1.05; background:#eee; border-bottom:1.8px solid var(--ink); }
.pcard .ph img, .pcard .ph svg{ width:100%; height:100%; object-fit:cover; display:block; }
.pc-b{ padding:16px 16px 20px; text-align:center; }
.pc-b h3{ margin:2px 0 6px; font:700 23px/1.2 var(--serif); }
.par{ margin:0 0 14px; font-size:14.5px; line-height:1.55; color:var(--ink-2); }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:7px 20px; border:1.8px solid var(--ink); border-radius:14px; background:var(--terra-2); font:700 15px var(--body); color:var(--ink); text-decoration:none; }
.amp{ text-align:center; font:46px/1.1 var(--script); color:var(--terra); margin:10px 0 6px; }
.quote{ margin:20px 2px 0; padding:14px 16px; border-radius:16px; background:var(--sage-2); font:italic 500 15px/1.65 var(--serif); color:var(--ink-2); text-align:center; }

.tl{ list-style:none; margin:0; padding:0 0 0 26px; position:relative; }
.tl::before{ content:""; position:absolute; left:8px; top:8px; bottom:8px; border-left:2px dotted var(--sage-d); }
.tl li{ position:relative; margin:0 0 18px; }
.tl li::before{ content:"🌿"; position:absolute; left:-27px; top:0; font-size:15px; background:var(--paper); line-height:1.3; }
.tl-y{ display:inline-block; font:700 12px var(--body); letter-spacing:.08em; background:var(--terra); color:#fff; border-radius:8px; padding:2px 10px; margin-bottom:7px; }
.tl-c{ border:1.8px solid var(--ink); border-radius:16px; padding:13px 14px; background:var(--sage-3); }
.tl-c img{ width:100%; border-radius:10px; margin-bottom:10px; display:block; border:1.5px solid var(--ink); }
.tl-c h4{ margin:0 0 5px; font:700 17px/1.3 var(--serif); }
.tl-c p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--ink-2); }
.end{ text-align:center; font:italic 500 15px/1.6 var(--serif); color:var(--sage-d); margin:4px 0 0; }

.sd{ text-align:center; background:var(--sage-3); border:1.8px solid var(--ink); border-radius:18px; padding:16px 10px 18px; margin-bottom:16px; }
.sd-d{ margin:0; font:700 12px var(--body); letter-spacing:.24em; text-transform:uppercase; color:var(--ink-2); }
.sd-big{ margin:4px 0 14px; font:700 30px var(--serif); color:var(--sage-d); }
.cd{ display:flex; justify-content:center; gap:7px; }
.cd div{ width:62px; padding:8px 0 7px; background:var(--paper); border:1.8px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); }
.cd b{ display:block; font:700 22px/1.1 var(--serif); color:var(--terra); }
.cd span{ font-size:11px; color:var(--ink-2); }
.cd-done{ margin:0; font:italic 500 16px var(--serif); color:var(--sage-d); }
.ev{ border:1.8px solid var(--ink); border-radius:18px; padding:18px 16px; margin-bottom:14px; text-align:center; background:var(--paper); box-shadow:0 3px 0 var(--ink); }
.ev-ic{ width:48px; height:48px; margin:0 auto 8px; display:grid; place-items:center; border-radius:16px; background:var(--terra-2); border:1.8px solid var(--ink); rotate:-6deg; }
.ev-ic .i{ width:24px; height:24px; }
.ev h3{ margin:0 0 6px; font:700 21px var(--serif); }
.ev-t{ margin:0 0 10px; font-size:14.5px; line-height:1.6; }
.ev-p{ margin:0 0 15px; font-size:14px; line-height:1.6; color:var(--ink-2); }
.ev-p b{ color:var(--ink); }
.note{ font-size:13.5px; line-height:1.6; color:var(--ink-2); text-align:center; background:#fbf1dc; border:1.6px dashed var(--gold); border-radius:14px; padding:10px 12px; margin:0 0 14px; }

const AU = (() => {
  let ctx = null, master = null, mus = null, timer = null, step = 0, nextT = 0;
  let musicOn = store.get("music", true);
  const bgm = $("#bgm");
  function init(){
    if (ctx){ if (ctx.state === "suspended" && !document.hidden) ctx.resume().catch(() => {}); return ctx; }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
      mus = ctx.createGain(); mus.gain.value = .7; mus.connect(master);
    } catch (e) { ctx = null; }
    return ctx;
  }
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  function pluck(f, t, d = 1.4, vol = .1, bus){
    if (!init()) return;
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = "sine"; o2.type = "triangle"; o.frequency.value = f; o2.frequency.value = f * 2; g2.gain.value = .1;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    g.connect(bus || master); o.start(t); o2.start(t); o.stop(t + d + .05); o2.stop(t + d + .05);
  }
  function sweep(f1, f2, d, { type = "sine", vol = .08, at = 0 } = {}){
    if (!init()) return; const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03);
  }
  // melodi waltz 3/4 (G – Em – C – D)
  const MEL = [67,71,74,0,79,0, 76,0,74,71,0,0, 72,76,79,0,76,0, 74,0,78,0,81,0,
               79,0,78,79,83,0, 81,0,79,76,0,0, 76,0,79,0,72,74, 78,0,74,0,0,0];
  const BASS = [43, 40, 48, 50, 43, 40, 48, 50], STEP = .26;
  function sched(){
    if (ctx.currentTime > nextT + .3) nextT = ctx.currentTime + .05;
    while (nextT < ctx.currentTime + .3){
      const i = step % MEL.length;
      if (MEL[i]) pluck(midi(MEL[i]), nextT, 1.5, .05, mus);
      if (i % 6 === 0){ const b = BASS[(i / 6) | 0]; pluck(midi(b), nextT, 2, .05, mus); pluck(midi(b + 7), nextT + STEP * 2, 1.2, .025, mus); pluck(midi(b + 12), nextT + STEP * 4, 1.2, .025, mus); }
      nextT += STEP; step++;
    }
  }
  function play(){
    if (CONFIG.musik){ if (!bgm.getAttribute("src")) bgm.src = CONFIG.musik; bgm.volume = .55; bgm.play().catch(() => {}); return; }
    if (!init() || timer) return; nextT = ctx.currentTime + .1; timer = setInterval(sched, 60);
  }
  function stop(){ if (CONFIG.musik){ bgm.pause(); return; } clearInterval(timer); timer = null; }
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden){ ctx.suspend && ctx.suspend(); if (CONFIG.musik) bgm.pause(); }
    else { ctx.resume && ctx.resume(); if (CONFIG.musik && musicOn && opened) bgm.play().catch(() => {}); }
  });
  const now = () => (init() ? ctx.currentTime : 0);
  return {
    init,
    get musicOn(){ return musicOn; },
    setMusic(on, remember = true){ musicOn = on; if (remember) store.set("music", on); on ? play() : stop(); },
    stopAll(){ stop(); },
    pop(){ sweep(480, 820, .13, { vol:.07 }); },
    close(){ sweep(720, 400, .1, { vol:.05 }); },
    tap(){ sweep(850, 1150, .05, { vol:.04 }); },
    chime(){ const t = now(); if (!ctx) return; [79, 83, 86, 91].forEach((n, i) => pluck(midi(n), t + i * .09, 1.2, .07)); },
    sparkle(){ const t = now(); if (!ctx) return; [91, 95, 98, 103, 107].forEach((n, i) => pluck(midi(n), t + i * .07, .8, .05)); },
    whoosh(){ sweep(300, 900, .35, { type:"triangle", vol:.05 }); },
    woof(){
      if (!init()) return;
      [0, .22].forEach(a => {
        const t = ctx.currentTime + a, o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        o.type = "sawtooth"; o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(170, t + .14);
        f.type = "lowpass"; f.frequency.value = 900; f.Q.value = 4;
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
        o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + .2);
      });
    }
  };
})();

function burst(x, y, items = ["🌸", "🍃", "✿"], n = 9){
  if (reduceMotion) return;
  const r = app.getBoundingClientRect();
  for (let i = 0; i < n; i++){
    const s = document.createElement("span"); s.className = "fx"; s.textContent = items[i % items.length];
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, d = 50 + Math.random() * 60;
    s.style.cssText = `left:${x - r.left - 10}px;top:${y - r.top - 12}px;color:${["#c96d47", "#4f6b58", "#e98a73"][i % 3]};--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d).toFixed(0)}px;--r:${((Math.random() - .5) * 60).toFixed(0)}deg;animation-delay:${(i * .03).toFixed(2)}s`;
    app.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e){ const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_){} ta.remove(); return ok; }
}

function cdTick(){
  const box = $("#cd"); if (!box){ clearInterval(cdTimer); return; }
  let s = Math.max(0, Math.floor((START - Date.now()) / 1000));
  if (s <= 0){ box.innerHTML = `<p class="cd-done">${Date.now() < END ? "Acara sedang berlangsung 🎉" : "Terima kasih sudah merayakan bersama kami 🌿"}</p>`; clearInterval(cdTimer); return; }
  box.innerHTML = [[86400, "Hari"], [3600, "Jam"], [60, "Menit"], [1, "Detik"]].map(([u, n], i) => { const v = Math.floor(s / u); s -= v * u; return `<div><b>${i ? pad(v) : v}</b><span>${n}</span></div>`; }).join("");
}

/* ================= KARTU POP-UP ================= */
const ov = $("#ov"), win = $("#win");
let modalOpen = null, lastFocus = null, closeT = null;
function openModal(id, from, opts){
  const S = SECTIONS[id]; if (!S) return;
  clearTimeout(closeT);
  if (!modalOpen) lastFocus = document.activeElement;
  $("#win-t").textContent = S.t;
  const b = $("#win-b"); b.innerHTML = S.r(); b.scrollTop = 0;
  ov.hidden = false; ov.classList.remove("open");
  if (from){ const r = from.getBoundingClientRect(), a = app.getBoundingClientRect(); win.style.transformOrigin = `${r.left + r.width / 2 - a.left - win.offsetLeft}px ${r.top + r.height / 2 - a.top - win.offsetTop}px`; }
  else win.style.transformOrigin = "50% 50%";
  void win.offsetWidth;
  requestAnimationFrame(() => ov.classList.add("open"));
  modalOpen = id; AU.pop();
  if (S.after) S.after(b, opts);
  if (!(opts && opts.focusMsg)) setTimeout(() => $(".x", win).focus({ preventScroll:true }), 60);
}
function closeModal(){
  if (!modalOpen) return;
  modalOpen = null; clearInterval(cdTimer);
  ov.classList.remove("open"); AU.close();
  closeT = setTimeout(() => { ov.hidden = true; $("#win-b").innerHTML = ""; if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true }); }, reduceMotion ? 0 : 450);
}
ov.addEventListener("click", async e => {
  if (e.target.closest("[data-close]")) return closeModal();
  const go = e.target.closest("[data-go]");
  if (go) return openModal(go.dataset.go, null, { focusMsg: go.hasAttribute("data-focus-msg") });
  const ph = e.target.closest("[data-photo]");
  if (ph) return openLb(+ph.dataset.photo);
  const cp = e.target.closest("[data-copy]");
  if (cp){
    AU.tap();
    if (await copyText(cp.dataset.copy)){ cp.textContent = "Tersalin ✓"; cp.classList.add("ok"); toast("Disalin ke clipboard 🌿", 1800); setTimeout(() => { cp.textContent = "Salin"; cp.classList.remove("ok"); }, 2000); }
    else toast("Gagal menyalin, salin manual ya");
  }
});
ov.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const f = $$('button:not([disabled]), a[href], input, textarea', win).filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ================= LIGHTBOX ================= */
const PHOTOS = CONFIG.galeri.map((src, i) => ({ src, i })).filter(p => p.src);
let lbI = -1;
function openLb(orig){ lbI = PHOTOS.findIndex(p => p.i === orig); if (lbI < 0) return; paintLb(); $("#lb").hidden = false; $("#lb-x").focus({ preventScroll:true }); }
function paintLb(){ $("#lb-img").src = PHOTOS[lbI].src; $("#lb-c").textContent = `${lbI + 1} / ${PHOTOS.length}`; $("#lb-p").hidden = $("#lb-n").hidden = PHOTOS.length < 2; }
function stepLb(d){ lbI = (lbI + d + PHOTOS.length) % PHOTOS.length; paintLb(); AU.tap(); }
function closeLb(){ $("#lb").hidden = true; lbI = -1; }
$("#lb-x").addEventListener("click", closeLb);
$("#lb-p").addEventListener("click", () => stepLb(-1));
$("#lb-n").addEventListener("click", () => stepLb(1));
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });
let sx = null;
$("#lb").addEventListener("pointerdown", e => { sx = e.clientX; });
$("#lb").addEventListener("pointerup", e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50 && PHOTOS.length > 1) stepLb(dx < 0 ? 1 : -1); });

addEventListener("keydown", e => {
  if (!$("#lb").hidden){
    if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") stepLb(-1); else if (e.key === "ArrowRight") stepLb(1);
    return;
  }
  if (e.key === "Escape" && modalOpen) closeModal();
});

const scene = $("#scene");
function hit(h){
  h.classList.remove("tap"); void h.getBoundingClientRect(); h.classList.add("tap");
  if (h.dataset.open === "story") AU.whoosh(); else AU.tap();
  setTimeout(() => openModal(h.dataset.open, h), reduceMotion ? 0 : 170);
}
const COUPLE_LINES = ["Psst… mereka lagi deg-degan 🤭", "Katanya: “jangan lupa datang ya!” 💐", "Calon pengantin sedang latihan senyum 😊", `${P.panggilan} lagi curi-curi pandang ke ${W.panggilan} 👀`];
let coupleI = 0;
const EGGS = {
  couple(el, x, y){ burst(x, y); AU.chime(); toast(COUPLE_LINES[coupleI++ % COUPLE_LINES.length]); },
  dog(el, x, y){ AU.woof(); burst(x, y, ["🐾", "🦴"], 5); toast(`Guk! ${CONFIG.namaAnjing} bangun sebentar… lalu tidur lagi 😴`); }
};
function onScene(target, x, y){
  if (ATUR && x != null){
    // mode atur: tampilkan koordinat titik yang diketuk (dalam piksel gambar / unit SVG)
    const pt = scene.createSVGPoint(); pt.x = x; pt.y = y;
    const p = pt.matrixTransform(scene.getScreenCTM().inverse());
    toast(`x: ${Math.round(p.x)}, y: ${Math.round(p.y)}`, 6000); console.log("titik:", Math.round(p.x), Math.round(p.y));
    return;
  }
  if (!opened) return;
  const h = target.closest("[data-open]"); if (h) return hit(h);
  const egg = target.closest("[data-egg]");
  if (egg){ if (x == null){ const r = egg.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 3; } EGGS[egg.dataset.egg](egg, x, y); }
}
scene.addEventListener("click", e => onScene(e.target, e.clientX, e.clientY));
scene.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); onScene(e.target); } });

  $("#cv-guest").textContent = GUEST;
  $("#open").innerHTML = `${ic("gate")} Masuk ke Taman Kami`;
  const art = `${leafEl(-44, 24, 6, -40)}${leafEl(44, 24, 6, 40)}<g transform="translate(-24 -16) scale(.62)">${chibi("m")}</g><g transform="translate(24 -16) scale(.62)">${chibi("f")}</g>${heartPath(0, -50, .9)}`;
  $("#cv-art").innerHTML = art;
  document.title = `${COUPLE} · Undangan Pernikahan`;

  // banner desktop
  buildBanner();
  if (CONFIG.fotoBanner){ const bg = $("#bn-bg"); bg.classList.add("photo"); bg.style.backgroundImage = `url("${encodeURI(CONFIG.fotoBanner)}")`; }
  $("#bn-art").innerHTML = art;
  $("#bn-n1").textContent = W.panggilan; $("#bn-n2").textContent = P.panggilan;
  $("#bn-date").textContent = `${E0.tanggal} · ${CONFIG.lokasi[0].tempat}`;
  $("#bn-guest").innerHTML = GUEST === CONFIG.tamuDefault ? "Dengan hormat mengundang Bapak/Ibu/Saudara/i" : `Kepada Yth. <b>${esc(GUEST)}</b>`;
  const tick = [`🌿 ${COUPLE}`, E0.tanggal, ...EVENTS.map(e => `${e.nama} · ${e.jam}`), ...new Set(CONFIG.lokasi.map(l => l.tempat)), "Selamat menempuh hidup baru"].map(t => `<span>${esc(t)}</span>`).join("");
  $("#bn-ticker").innerHTML = tick + tick;

  paintWishHide(); paintMusic(); showWish(0, false);
})();
</script>
</body>
</html>
